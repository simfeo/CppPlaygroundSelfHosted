<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C++ Playground</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="toolbar">
    <span class="brand">C++ Playground</span>
    <button id="btnRun" class="primary">▶ Run <kbd>Ctrl+↵</kbd></button>
    <button id="btnStop" disabled title="Terminate the running program">■ Stop</button>
    <span class="sep"></span>
    <label>std
      <select id="selStd">
        <option>c++11</option>
        <option>c++14</option>
        <option selected>c++17</option>
        <option>c++20</option>
      </select>
    </label>
    <label>opt
      <select id="selOpt">
        <option value="0">-O0</option>
        <option value="1">-O1</option>
        <option value="2" selected>-O2</option>
        <option value="3">-O3</option>
        <option value="s">-Os</option>
      </select>
    </label>
    <label class="grow">flags
      <input id="txtFlags" type="text" placeholder="-Wall -DFOO=1" spellcheck="false">
    </label>
    <span class="sep"></span>
    <label>Theme:
      <select id="selTheme" title="Editor and interface colours">
        <option value="system">System</option>
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </label>
    <button id="btnZip">⤓ Download .zip</button>
    <button id="btnReset">Reset</button>
  </header>

  <main id="main">
    <nav id="sidebar">
      <div class="panel-head">
        <span>Files</span>
        <button id="btnNewFile" title="New file">＋</button>
      </div>
      <ul id="fileList"></ul>
      <div class="panel-head">
        <span>Project</span>
      </div>
      <div class="pad">
        <input id="txtProject" type="text" spellcheck="false" title="Project name (used for CMake target and zip name)">
      </div>
    </nav>
    <div class="splitter" id="splitLeft" title="Drag to resize, double-click to reset"></div>

    <section id="editorPane">
      <div id="tabs"></div>
      <div id="editor"></div>
    </section>

    <div class="splitter" id="splitRight" title="Drag to resize, double-click to reset"></div>
    <section id="ioPane">
      <div class="panel-head">
        <span>Output</span>
        <span id="status" class="status">idle</span>
        <button id="btnClear" title="Clear output">✕</button>
      </div>
      <pre id="console"></pre>
      <div id="prompt" hidden>
        <span class="prompt-caret">▶</span>
        <input id="liveInput" spellcheck="false" autocomplete="off"
               placeholder="the program is waiting — type, then Enter (Ctrl+D ends input)">
      </div>
      <div class="splitter horizontal" id="splitBottom" title="Drag to resize, double-click to reset"></div>
      <div id="ioBottom">
        <div class="panel-head"><span>Arguments</span></div>
        <div class="pad">
          <input id="txtArgs" type="text" spellcheck="false"
                 placeholder="argv, e.g. --verbose &quot;file name.txt&quot;">
        </div>
        <div class="panel-head"><span>Program input (stdin)</span><span id="stdinNote" class="note"></span></div>
        <textarea id="stdin" spellcheck="false" placeholder="Sent before any typing. Leave empty to type everything live."></textarea>
      </div>
    </section>
  </main>

  <script src="vendor/ace/ace.js"></script>
  <script src="vendor/ace/mode-c_cpp.js"></script>
  <script src="js/ace-theme-vscode.js"></script>
  <script src="js/stdin-channel.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/cmake.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/ts-highlight.js"></script>
</body>
</html>
