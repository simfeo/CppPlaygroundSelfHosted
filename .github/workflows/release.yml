name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tag annotations do not exist in a shallow clone

      - name: Work out the version
        id: version
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Release notes from the tag annotation
        # The annotation is where a release is actually described. Without this
        # every release repeats the same blurb and says nothing about itself.
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          annotation=$(git for-each-ref "refs/tags/$tag" --format='%(contents)')
          if [ -n "$(printf '%s' "$annotation" | tr -d '[:space:]')" ]; then
            printf '%s\n\n' "$annotation" > notes.md
          else
            echo "::warning::$tag carries no annotation; using the generic blurb"
            printf '%s\n\n' "A C++ playground that compiles and runs in the browser: clang 22.1.8 built for \`wasm32-wasi\`, with libc++, threads and exceptions." > notes.md
          fi
          {
            echo '**To run it**'
            echo
            echo '```'
            echo "unzip cpp-playground-$tag.zip"
            echo "cd cpp-playground-$tag"
            echo 'python serve.py'
            echo '```'
            echo
            echo 'Then open <http://localhost:8080/>. Nothing is installed and nothing'
            echo 'is compiled on the server - clang runs in your browser.'
          } >> notes.md
          echo '--- notes.md ---'; cat notes.md

      - name: Package the playground
        # Everything needed to run it: the built app and the server, nothing else.
        run: |
          name="cpp-playground-${{ steps.version.outputs.tag }}"
          mkdir -p "package/$name"
          cp -r dist "package/$name/dist"
          cp serve.py README.md LICENSE "package/$name/"
          cd package
          zip -qr "../$name.zip" "$name"
          tar czf "../$name.tar.gz" "$name"
          cd ..
          sha256sum "$name.zip" "$name.tar.gz" > checksums.txt
          ls -la "$name.zip" "$name.tar.gz"
          cat checksums.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            cpp-playground-${{ steps.version.outputs.tag }}.zip
            cpp-playground-${{ steps.version.outputs.tag }}.tar.gz
            checksums.txt
          body_path: notes.md
